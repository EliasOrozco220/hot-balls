<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cookie Clicker</title>

<style>
body {
    background-color: #0d095f;
    text-align: center;
    font-family: 'Comic Sans MS', sans-serif;
    color: #000;
    background-image: url('Menu.png');
    background-repeat: no-repeat;
    background-attachment: fixed;
    background-size: cover;
}

button {
    padding: 10px 20px;
    font-size: 20px;
    font-family: 'Comic Sans MS', sans-serif;
    font-weight: bold;
    cursor: pointer;
    background-color: #de661a;
    color: #000;
    border: black solid 4px;
    border-radius: 5px;
}

button:hover {
    background-color: #c1400d;
}

.floating-btn {
    position: fixed;
    bottom: 260px;
    right: 100px;
}

.floating-btn2 {
    position: fixed;
    bottom: 150px;
    right: 100px;
}

.credit {
    position: fixed;
    top: 20px;
    left: 20px;
    font-size: 20px;
}
</style>
</head>

<body>

<div class="credit">Game created by Elias Orozco, 2026</div>

<button class="floating-btn" onclick="startGame()">Play Game</button>
<button class="floating-btn2" onclick="restartGame()">New Game</button>

<script>
// Same save key used everywhere
const SAVE_KEY = "cookieClickerSave";

// Optional: check if save exists
function hasSave() {
    return localStorage.getItem(SAVE_KEY) !== null;
}

function startGame() {
    if (hasSave()) {
        // go to game normally (it will load automatically)
        window.location.href = "clicker.html";
    } else {
        // no save yet
        window.location.href = "clicker.html";
    }
}

function restartGame() {
    const confirmReset = confirm("Are you sure you want to restart your game?");

    if (confirmReset) {
        localStorage.removeItem(SAVE_KEY);
        window.location.href = "clicker.html";
    }
}
</script>

</body>
</html>
